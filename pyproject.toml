[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vendor-data-onboarding-kit"
version = "0.1.0"
description = "Bitemporal vendor data onboarding kit with point-in-time correctness and readiness reporting."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "PromptCultivator" }
]
dependencies = [
    "duckdb==2.0.0",
    "pyarrow==26.0.1",
    "polars==2.1.0",
    "pydantic==2.14.3",
    "typer==0.29.0",
    "pyyaml==6.0.3",
    "python-dateutil==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.15",
    "ruff==0.17.4",
    "pyright==1.1.414",
]

[project.scripts]
vdok = "vdok.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vdok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*Arrow output on a DB-API result.*:UserWarning",
]

[tool.coverage.run]
source = ["vdok"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pyright]
include = ["vdok", "tests", "bench"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
